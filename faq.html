<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>常見問題 | 銳鋒顧問</title>
    <style>
        /* ---------- 與主頁完全一致的基礎樣式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
        }
        body {
            background: #020510;
            color: #e2e8f0;
            line-height: 1.8;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ----- 頂部導航 (與主頁一致) ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(2, 5, 16, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 0;
            transition: 0.4s;
        }
        .header.scrolled {
            padding: 8px 0;
        }
        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-right: auto;
        }
        .logo a {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo .brand-cn {
            font-size: 2.6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1;
        }
        .logo .brand-en {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            align-items: center;
        }
        .nav-links a {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 0;
            position: relative;
            transition: color 0.3s;
        }
        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .nav-links a:hover {
            color: #3b82f6;
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 30px;
            padding: 4px 6px;
            margin-left: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            user-select: none;
        }
        .lang-switch:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .lang-switch .lang-opt {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #94a3b8;
            transition: all 0.3s ease;
            background: transparent;
        }
        .lang-switch .lang-opt.active {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
        }
        .lang-switch .lang-divider {
            color: #334155;
            font-weight: 300;
            font-size: 0.8rem;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            margin-left: 12px;
        }
        .menu-toggle span {
            width: 26px;
            height: 2px;
            background: #e2e8f0;
            transition: 0.3s;
        }

        #backToTop {
            position: fixed;
            bottom: 40px;
            right: 30px;
            z-index: 999;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
        }
        #backToTop.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        #backToTop:hover {
            background: #2563eb;
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.5);
        }
        #backToTop svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- FAQ 頁面專用內容樣式 ---------- */
        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }
        .section-label .label-en {
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #3b82f6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
            opacity: 0.7;
        }
        .section-label .label-en::before,
        .section-label .label-en::after {
            content: "";
            flex: 1;
            height: 1px;
            max-width: 100px;
            background: linear-gradient(90deg, transparent, #3b82f6);
        }
        .section-label .label-en::after {
            background: linear-gradient(90deg, #3b82f6, transparent);
        }
        .section-title h2 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .section-title h2.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .section-title .line {
            width: 60px;
            height: 3px;
            background: #3b82f6;
            margin: 15px auto 0;
        }

        .hero {
            width: 100%;
            min-height: 55vh;
            display: flex;
            align-items: center;
            padding: 120px 40px 80px;
            position: relative;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
            z-index: 0;
            animation: heroZoom 20s ease-in-out infinite alternate;
        }
        @keyframes heroZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .hero-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(10, 15, 30, 0.15) 0%, rgba(2, 5, 16, 0.15) 90%);
            z-index: 1;
        }
        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
        }
        .hero-text h1 {
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-text h1.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .hero-text h1 .highlight {
            color: #3b82f6;
        }
        .hero-text p {
            font-size: 1.2rem;
            color: #e2e8f0;
            max-width: 700px;
            margin: 0 auto 30px;
            line-height: 1.9;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-text p.visible {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.2s;
        }

        .faq-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .faq-item {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            padding: 30px 35px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        .faq-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .faq-item:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }
        .faq-item .q {
            font-size: 1.1rem;
            font-weight: 700;
            color: #3b82f6;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 0;
            transition: margin-bottom 0.4s ease;
        }
        .faq-item .q .num {
            color: #3b82f6;
            font-weight: 800;
            font-size: 1.2rem;
            flex-shrink: 0;
            min-width: 28px;
            opacity: 0.6;
        }
        .faq-item .q .icon-arrow {
            margin-left: auto;
            transition: transform 0.4s ease;
            color: #64748b;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .faq-item.open .q .icon-arrow {
            transform: rotate(180deg);
        }
        .faq-item .a {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.9;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), padding-top 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            padding-top: 0;
        }
        .faq-item.open .a {
            max-height: 600px;
            opacity: 1;
            padding-top: 18px;
        }
        .faq-item .a p {
            margin-bottom: 10px;
        }
        .faq-item .a ul {
            list-style: none;
            padding: 0;
            margin: 8px 0;
        }
        .faq-item .a ul li {
            padding: 3px 0 3px 20px;
            position: relative;
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .faq-item .a ul li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: #3b82f6;
        }

        /* ----- 頁腳 (與主頁一致) ----- */
        .footer {
            background: #fff;
            color: #1a202c;
            padding: 50px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer-social {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .footer-social a {
            color: #333;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .footer-social a:hover {
            color: #2563eb;
            transform: translateY(-2px);
        }
        .footer-social a svg {
            width: 24px;
            height: 24px;
        }
        .copyright {
            font-size: 0.9rem;
            color: #555;
        }

        /* ----- 響應式 (與主頁一致) ----- */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #020510;
                padding: 20px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
                gap: 16px;
            }
            .nav-links.active {
                display: flex;
            }
            .menu-toggle {
                display: flex;
            }
            .nav-container {
                padding: 0 16px 0 12px;
            }
            .logo .brand-cn {
                font-size: 1.8rem;
            }
            .logo .brand-en {
                font-size: 0.85rem;
            }
            .lang-switch {
                margin-left: 10px;
                padding: 2px 4px;
            }
            .lang-switch .lang-opt {
                padding: 2px 10px;
                font-size: 0.7rem;
            }
            .hero {
                min-height: 45vh;
                padding: 90px 16px 40px;
            }
            .hero-text h1 {
                font-size: 2.2rem;
            }
            .hero-text p {
                font-size: 1rem;
            }
            .faq-item {
                padding: 22px 20px;
            }
            .faq-item .q {
                font-size: 0.95rem;
            }
            .faq-item .a {
                font-size: 0.9rem;
            }
            .footer {
                padding: 30px 16px;
            }
            .footer-social {
                gap: 20px;
            }
            #backToTop {
                bottom: 20px;
                right: 16px;
                width: 44px;
                height: 44px;
            }
            #backToTop svg {
                width: 22px;
                height: 22px;
            }
        }
        @media (max-width: 480px) {
            .hero-text h1 {
                font-size: 1.8rem;
            }
            .faq-item {
                padding: 18px 16px;
            }
            .faq-item .q {
                font-size: 0.9rem;
                gap: 10px;
            }
        }
    </style>
</head>

    <script>
        // =============================================================
        // 1. 語言切換系統（與主頁一致，但加入 faq 專屬翻譯）
        // =============================================================
        const i18n = {
            'zh': {
                // 導航
                'nav.services': '業務範圍',
                'nav.cases': '成功案例',
                'nav.process': '咨詢流程',
                'nav.contact': '聯絡我們',

                // FAQ 問題（共12條）
                'faq.q1': '銳鋒顧問提供哪些服務？',
                'faq.a1': '我們提供全面的市場研究與商業諮詢服務，涵蓋量化問卷調查、深度訪談、焦點小組、神秘顧客調查、大數據分析、品牌策略規劃、市場進入可行性評估，以及長期市場監測等。服務對象包括零售、餐飲、美妝、消費品及商業服務等多個行業。',

        let currentLang = 'zh';

        function applyLanguage(lang) {
            currentLang = lang;
            const dict = i18n[lang];
            if (!dict) return;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) {
                    el.innerHTML = dict[key];
                }
            });

            const brandCn = document.getElementById('brandCn');
            if (brandCn) {
                brandCn.style.display = (lang === 'zh') ? 'inline' : 'none';
            }

            const zhLabel = document.getElementById('langZhLabel');
            if (zhLabel) {
                zhLabel.textContent = (lang === 'zh') ? '中' : 'CH';
            }

            document.querySelectorAll('.lang-opt').forEach(opt => {
                const l = opt.getAttribute('data-lang');
                opt.classList.toggle('active', l === lang);
            });

            document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
            try { localStorage.setItem('topmarket-lang', lang); } catch (e) {}
        }

        document.querySelectorAll('.lang-opt').forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const lang = this.getAttribute('data-lang');
                if (lang !== currentLang) {
                    applyLanguage(lang);
                }
            });
        });

        // 恢復語言（與主頁一致，默認英文）
        (function restoreLang() {
            try {
                const saved = localStorage.getItem('topmarket-lang');
                if (saved && (saved === 'zh' || saved === 'en')) {
                    applyLanguage(saved);
                    return;
                }
            } catch (e) {}
            applyLanguage('en');
        })();

        // =============================================================
        // 2. 滾動監聽、返回頂部、菜單切換（與主頁一致）
        // =============================================================
        window.addEventListener('scroll', () => {
            const h = document.getElementById('header');
            if (window.scrollY > 50) h.classList.add('scrolled');
            else h.classList.remove('scrolled');
            const backBtn = document.getElementById('backToTop');
            if (window.scrollY > 400) backBtn.classList.add('show');
            else backBtn.classList.remove('show');
        });
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('active');
        });
        document.getElementById('backToTop').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // =============================================================
        // 3. 動態生成 FAQ 列表（支援語言切換後自動更新）
        // =============================================================
        const faqKeys = [
            'q1', 'q2', 'q3', 'q4', 'q5', 'q6',
            'q7', 'q8', 'q9', 'q10', 'q11', 'q12'
        ];

        const container = document.getElementById('faqContainer');

        function renderFAQ(lang) {
            const dict = i18n[lang];
            if (!dict) return;
            let html = '';
            faqKeys.forEach((key, idx) => {
                const qKey = `faq.${key}`;
                const aKey = `faq.a${key.slice(1)}`;
                const qText = dict[qKey] || qKey;
                const aText = dict[aKey] || aKey;
                const num = (idx + 1).toString().padStart(2, '0');
                html += `
                    <div class="faq-item" data-key="${key}">
                        <div class="q">
                            <span class="num">${num}</span>
                            <span>${qText}</span>
                            <span class="icon-arrow">▾</span>
                        </div>
                        <div class="a">
                            <p>${aText}</p>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 重新綁定點擊展開事件
            document.querySelectorAll('.faq-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    // 如果點擊的是箭頭或文字，切換開合
                    this.classList.toggle('open');
                });
            });

            // 觸發可見性動畫（稍後由 Observer 處理）
            observeFAQItems();
        }

        // =============================================================
        // 4. Intersection Observer 觸發可見性
        // =============================================================
        let faqObserver = null;

        function observeFAQItems() {
            if (faqObserver) {
                faqObserver.disconnect();
            }
            faqObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

            document.querySelectorAll('.faq-item').forEach(el => {
                faqObserver.observe(el);
            });
        }

        // =============================================================
        // 5. 初始化：渲染 FAQ + 監測 Hero 標題
        // =============================================================
        // 首次渲染（使用當前語言）
        renderFAQ(currentLang);

        // 監測 Hero 標題及描述
        const heroObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.hero-title, .hero-desc').forEach(el => {
            heroObserver.observe(el);
        });

        // =============================================================
        // 6. 語言切換時重新渲染 FAQ（保留已展開狀態可選，此處簡單重新渲染）
        // =============================================================
        // 擴展 applyLanguage 以重新渲染 FAQ
        const originalApply = applyLanguage;
        applyLanguage = function(lang) {
            originalApply(lang);
            renderFAQ(lang);
        };

        // 覆蓋語言切換事件，使用新的 applyLanguage
        document.querySelectorAll('.lang-opt').forEach(opt => {
            opt.removeEventListener('click', () => {});
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const lang = this.getAttribute('data-lang');
                if (lang !== currentLang) {
                    applyLanguage(lang);
                }
            });
        });

        // 重新綁定一次確保生效
        // 由於上面已經綁定，但被覆蓋了，重新綁定
        // 此處簡單重新執行一次綁定
        (function rebindLang() {
            const opts = document.querySelectorAll('.lang-opt');
            // 移除所有監聽 (簡單方式：克隆替換)
            const parent = opts[0]?.parentNode;
            if (parent) {
                const newParent = parent.cloneNode(true);
                parent.parentNode.replaceChild(newParent, parent);
                // 重新綁定
                newParent.querySelectorAll('.lang-opt').forEach(opt => {
                    opt.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const lang = this.getAttribute('data-lang');
                        if (lang !== currentLang) {
                            applyLanguage(lang);
                        }
                    });
                });
                // 更新 active 狀態
                newParent.querySelectorAll('.lang-opt').forEach(opt => {
                    const l = opt.getAttribute('data-lang');
                    opt.classList.toggle('active', l === currentLang);
                });
                // 更新 zhLabel
                const zhLabel = document.getElementById('langZhLabel');
                if (zhLabel) {
                    zhLabel.textContent = (currentLang === 'zh') ? '中' : 'CH';
                }
            }
        })();

        console.log('✅ FAQ 頁面已載入，語言:', currentLang);
    </script>
