<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>會員登入 | 銳鋒顧問</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
        }
        body {
            background: #020510;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-wrapper {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 50px 45px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s ease forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .login-wrapper .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-wrapper .logo .brand-cn {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }
        .login-wrapper .logo .brand-en {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .login-wrapper h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-wrapper .sub {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }
        .form-group input::placeholder {
            color: #475569;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .login-wrapper .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-wrapper .back-link a {
            color: #64748b;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        .login-wrapper .back-link a:hover {
            color: #3b82f6;
        }
        @media (max-width: 480px) {
            .login-wrapper { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo">
            <div class="brand-cn">銳鋒</div>
            <div class="brand-en">Top Market Consulting</div>
        </div>
        <h1>會員登入</h1>
        <p class="sub">請登入以存取會員專屬內容</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">電郵地址</label>
                <input type="email" id="email" placeholder="you@example.com" value="demo@topmarket.hk">
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" placeholder="••••••••" value="password123">
            </div>
            <button type="submit" class="btn-login">登入</button>
            <div class="error-msg" id="errorMsg">電郵或密碼不正確，請重新輸入。</div>
        </form>
        <div class="back-link">
            <a href="index.html">← 返回首頁</a>
        </div>
        <p style="text-align:center;color:#475569;font-size:0.75rem;margin-top:20px;">示範帳號：demo@topmarket.hk / password123</p>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMsg');
            
            // 示範驗證（可自訂）
            if (email === 'demo@topmarket.hk' && password === 'password123') {
                // 登入成功，儲存 session
                sessionStorage.setItem('topmarket_logged_in', 'true');
                sessionStorage.setItem('topmarket_user', email);
                // 獲取登入前頁面，預設 resources.html
                const redirect = sessionStorage.getItem('topmarket_redirect') || 'resources.html';
                window.location.href = redirect;
            } else {
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 3000);
            }
        });

        // 如已登入，直接跳轉
        if (sessionStorage.getItem('topmarket_logged_in') === 'true') {
            const redirect = sessionStorage.getItem('topmarket_redirect') || 'resources.html';
            window.location.href = redirect;
        }
    </script>
</body>
</html>
